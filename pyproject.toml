[project]
name = "agentic-agent-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ver0018", email = "rogerpantilyowger@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "ddgs>=9.16.1",
    "fonttools>=4.68.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-agent-1 = "agentic_agent_1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
]
